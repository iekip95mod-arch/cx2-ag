name: check

# Several agents push to several branches at once, so the two things that decide turnaround are
# canceling superseded runs and giving the fast gate its own job rather than queueing it behind
# the slow one. Both are below.
#

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

# One run per ref per event. A second push to the same branch kills the first rather than queueing
# behind it, which is what stops a busy agent from spending every runner on results nobody will read.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

env:
  CCACHE_DIR: ${{ github.workspace }}/.ccache
  CCACHE_MAXSIZE: 900M
  CMAKE_GENERATOR: Ninja

jobs:
  fast:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Verify CI dependency and emulator contracts
        run: ruby .github/scripts/test-ci-scheduling.rb

      - name: Verify SDK filesystem fixtures
        run: python3 vendor/ndl-src/ndl-sdk/libsyscalls/test_open.py

      - uses: actions/setup-node@v6
        with:
          node-version: '24'

      # A workflow GitHub refuses to load produces runs with no jobs rather than a failure anybody
      # reads, so this has to fail here, on the pull request that writes it.
      - name: Check no workflow sets a key twice
        run: node .github/scripts/workflow-keys.mjs

      - name: Verify event authentication and task routing
        env:
          TEST_WORKSPACE: ${{ runner.temp }}
        run: node --test tools/github-events/bridge.test.mjs tools/github-events/receiver/receiver.test.mjs .github/scripts/test-*.mjs

      # Two open pull requests editing one file conflict whoever merges second, and AGENTS.md asks for
      # that order to be coordinated rather than discovered. This is where it stops being a convention.
      - name: Require a declared order for overlapping pull requests
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: node .github/scripts/pr-sequence.mjs

      - name: Install prerequisites
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config ccache libgmp-dev zlib1g-dev lua5.1 python3 \
            luajit libluajit-5.1-dev
          sudo update-alternatives --set lua-interpreter /usr/bin/lua5.1
          lua -e 'assert(_VERSION == "Lua 5.1")'
          # nps_luax is what compiles lua_module.cc, and it configures only when both of these
          # answer, so a missing headers package has to stop the job rather than skip the target.
          luajit -e 'assert(jit)'
          pkg-config --exists luajit

      - name: Restore compiler cache
        uses: actions/cache@v6
        with:
          path: .ccache
          key: ccache-fast-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            ccache-fast-${{ runner.os }}-

      - name: Configure
        run: |
          cmake -S nps -B nps/build/host \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DNDL_SDK=${{ github.workspace }}/vendor/ndl-src/ndl-sdk \
            -DGIAC_ROOT=${{ github.workspace }}/vendor/khi-src

      - name: Build
        run: cmake --build nps/build/host --parallel

      # A suite that is not registered is silently not run, and -R reports success over whichever
      # ones were. This caught luax_host going missing when the runner had luajit but not its
      # headers.
      # Asked by name rather than by counting rows, because ctest adds the setup test of any fixture
      # a selected test requires. ui_smoke_v4 requires nps_evidence_luax, which exists only when
      # luajit does, so a count that reads 2 today reads 3 the moment the bridge is buildable.
      - name: Check both suites are registered
        run: |
          ctest --test-dir nps/build/host -N | sed -n 's/^ *Test *#[0-9]*: *//p' > /tmp/registered.txt
          cat /tmp/registered.txt
          for suite in unit ui_smoke_v4; do
            grep -qx "$suite" /tmp/registered.txt || { echo "not registered: $suite"; exit 1; }
          done

      # Without luajit nothing in a host configure compiles lua_module.cc at all, so the bridge
      # reached review green twice on code that does not build. Asserting the target exists is what
      # keeps that from silently coming back if the package ever stops installing.
      - name: Check the bridge target is configured
        run: |
          ninja -C nps/build/host -t targets all | grep -q 'nps_luax'

      - name: Unit and shell suites
        run: ctest --test-dir nps/build/host --output-on-failure -R '^(unit|ui_smoke_v4)$'

      - name: Cache statistics
        if: always()
        run: ccache --show-stats

  full:
    needs: [fast, review-ready]
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Restore the cross toolchain
        id: toolchain
        uses: actions/cache/restore@v6
        with:
          path: vendor/ndl-src/ndl-sdk/toolchain/install
          key: ndl-toolchain-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.github/scripts/prepare-review.sh', 'vendor/ndl-src/ndl-sdk/toolchain/build_toolchain.sh', 'vendor/deps/build-gmp.sh', 'vendor/deps/build-mpfr-mpfi.sh') }}

      - name: Prepare complete SDK and bridge prerequisites
        run: bash .github/scripts/prepare-review.sh

      - name: Save the complete cross toolchain
        if: steps.toolchain.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: vendor/ndl-src/ndl-sdk/toolchain/install
          key: ${{ steps.toolchain.outputs.cache-primary-key }}

      - name: Restore compiler cache
        uses: actions/cache@v6
        with:
          path: .ccache
          key: ccache-full-${{ runner.os }}-${{ runner.arch }}-${{ github.sha }}
          restore-keys: |
            ccache-full-${{ runner.os }}-${{ runner.arch }}-

      - name: Configure
        run: |
          cmake -S nps -B nps/build/host \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DNDL_SDK=${{ github.workspace }}/vendor/ndl-src/ndl-sdk \
            -DGIAC_ROOT=${{ github.workspace }}/vendor/khi-src

      - name: Build
        run: cmake --build nps/build/host --parallel

      - name: Check the bridge suite registered
        run: ctest --test-dir nps/build/host -N -R '^luax_host$' | grep "Test *#"

      - name: Full suite
        run: ctest --test-dir nps/build/host --output-on-failure --parallel "$(nproc)"

  # Boots TI OS and photographs the screen. The old job of this name built Firebird and ran
  # Firebird's own unit tests, which tested the emulator rather than testing with it, and said so in
  # its own summary. This one produces a frame.
  #
  # lfs: true on the checkout is what makes it possible at all. The images are LFS tracked and
  # actions/checkout leaves pointers by default, which emurun now refuses by name rather than
  # handing 130 bytes to the emulator.
  emulator:
    needs: [fast, review-ready]
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
          lfs: true

      - name: Install emulator prerequisites
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends build-essential zlib1g-dev python3

      - name: Build the headless emulator
        run: make -C vendor/firebird-src/headless -j"$(nproc)"

      # Its own copy, because a run that writes flash must not touch what the next job checks out.
      #
      # The images are not on main yet, so this has to say so rather than die on a missing file. It
      # reports the skip to the job summary, which is the difference between a stage that did not run
      # and a stage nobody noticed did not run. emurun refuses an LFS pointer for the same reason:
      # a checkout without lfs leaves a file that exists and is 130 bytes.
      - name: Boot the calculator and photograph the screen
        run: |
          mkdir -p .Internal/workspaces/ci-emulator
          if [ ! -f images/nspire-os.img ]; then
            echo "No flash image in this checkout, so the calculator was not booted." >> "$GITHUB_STEP_SUMMARY"
            echo "images/nspire-os.img is absent" >&2
            exit 0
          fi
          cp images/nspire-os.img .Internal/workspaces/ci-emulator/flash.img
          python3 tools/emu/emurun.py \
            --skip-when-absent \
            --flash .Internal/workspaces/ci-emulator/flash.img \
            --out .Internal/workspaces/ci-emulator/screen.ppm \
            --png .Internal/workspaces/ci-emulator/screen.png

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: emulator-screen
          path: .Internal/workspaces/ci-emulator/screen.png
          if-no-files-found: warn

      - name: Record what this proved
        run: |
          if [ -f .Internal/workspaces/ci-emulator/screen.png ]; then
            echo "TI OS booted under Firebird headless and the screen was captured. Keys are not exercised, see issue 386." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No screen was captured, so nothing here establishes that the calculator boots." >> "$GITHUB_STEP_SUMMARY"
          fi

  review-ready:
    needs: fast
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 145
    permissions:
      contents: read
      actions: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Wait for the current PR reviewer to approve
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node .github/scripts/wait-for-review.mjs
