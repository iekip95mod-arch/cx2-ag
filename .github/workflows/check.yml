name: check

# Several agents push to several branches at once, so the two things that decide turnaround are
# canceling superseded runs and giving the fast gate its own job rather than queueing it behind
# the slow one. Both are below.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Only the device job reads this. It is too slow to gate a push and too useful to never run.
  schedule:
    - cron: "17 4 * * 1"

# One run per ref per event. A second push to the same branch kills the first rather than queueing
# behind it, which is what stops a busy agent from spending every runner on results nobody will read.
# The event name is in the group because push, schedule and dispatch on main all resolve to the same
# ref, and without it an ordinary push cancels the two hour device build it happened to overlap.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

env:
  CCACHE_DIR: ${{ github.workspace }}/.ccache
  CCACHE_MAXSIZE: 900M
  CMAKE_GENERATOR: Ninja

jobs:
  # The gate. Three suites that between them catch nearly everything, reported before the full run
  # has finished configuring. Nothing depends on this job, so a failure here does not cancel the
  # others and you still learn what else broke in the same push.
  fast:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install prerequisites
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            ninja-build cmake ccache pkg-config libgmp-dev zlib1g-dev python3

      - name: Restore compiler cache
        uses: actions/cache@v4
        with:
          path: .ccache
          key: ccache-fast-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            ccache-fast-${{ runner.os }}-

      - name: Configure
        run: |
          cmake -S nps -B nps/build/host \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DNDL_SDK=${{ github.workspace }}/vendor/ndl-src/ndl-sdk \
            -DGIAC_ROOT=${{ github.workspace }}/vendor/khi-src

      - name: Build
        run: cmake --build nps/build/host --parallel

      # A suite that is not registered is silently not run, and -R reports success over whichever
      # ones were. This caught luax_host going missing when the runner had luajit but not its
      # headers. The bridge suite is not here: it needs luajit, and enabling luajit pulls the ARM
      # cross toolchain into configure, which is the opposite of fast. It runs in full instead.
      - name: Check both suites are registered
        run: |
          found=$(ctest --test-dir nps/build/host -N -R '^(unit|ui_smoke_v4)$' | grep -c "Test *#")
          echo "registered: $found"
          test "$found" -eq 2

      - name: Unit and shell suites
        run: ctest --test-dir nps/build/host --output-on-failure -R '^(unit|ui_smoke_v4)$'

      - name: Cache statistics
        if: always()
        run: ccache --show-stats

  # Everything ctest knows about. Runs beside the gate rather than after it.
  # Gated on the fast suite. If the three quick suites are already red, the full run would only
  # report the same failures more slowly, and a runner spent on that is a runner another agent is
  # waiting for.
  full:
    needs: fast
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install prerequisites
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            ninja-build cmake ccache pkg-config libgmp-dev zlib1g-dev python3 php-cli

      - name: Restore compiler cache
        uses: actions/cache@v4
        with:
          path: .ccache
          key: ccache-full-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            ccache-full-${{ runner.os }}-

      - name: Configure
        run: |
          cmake -S nps -B nps/build/host \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DNDL_SDK=${{ github.workspace }}/vendor/ndl-src/ndl-sdk \
            -DGIAC_ROOT=${{ github.workspace }}/vendor/khi-src

      - name: Build
        run: cmake --build nps/build/host --parallel

      # Not the check target, because that serializes. ctest runs the suites across the runner's
      # cores and reports every failure rather than stopping at the first.
      - name: Full suite
        run: ctest --test-dir nps/build/host --output-on-failure --parallel 4

  # Deliberately NOT on push. The ARM toolchain is not in this repository: vendor/ndl-src/ndl-sdk
  # tracks build_toolchain.sh and a gitignore, and nspire-gcc is not tracked either, so a runner has
  # to build a cross compiler before it can configure. Distribution arm-none-eabi packages do not
  # substitute, which is what the first attempt proved: cmake's own compiler probe failed to link.
  # Run it by hand when the device build matters, or let the weekly run catch a break.
  device:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install prerequisites
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            ninja-build cmake ccache pkg-config zlib1g-dev \
            libgmp-dev libmpfr-dev libmpc-dev python3 python3-dev \
            build-essential texinfo bison flex wget

      # The expensive step, and the reason this job is not a gate. Cached on the build script, so it
      # is paid once and then reused until that script changes.
      - name: Restore the cross toolchain
        id: toolchain
        uses: actions/cache@v4
        with:
          path: vendor/ndl-src/ndl-sdk/toolchain/install
          key: ndl-toolchain-${{ runner.os }}-${{ hashFiles('vendor/ndl-src/ndl-sdk/toolchain/build_toolchain.sh') }}

      # build_toolchain.sh fetches through ftpmirror.gnu.org, which round robins across mirrors, and
      # one of them answered 404 for binutils 2.44. The script skips a download whose directory is
      # already extracted, so the sources arrive here from the canonical hosts instead. The versions
      # are the ones the script names and have to be changed with it.
      - name: Prefetch the toolchain sources
        if: steps.toolchain.outputs.cache-hit != 'true'
        working-directory: vendor/ndl-src/ndl-sdk/toolchain
        run: |
          mkdir -p download
          cd download
          for url in \
            https://ftp.gnu.org/gnu/binutils/binutils-2.44.tar.bz2 \
            https://ftp.gnu.org/gnu/gcc/gcc-14.2.0/gcc-14.2.0.tar.xz \
            https://ftp.gnu.org/gnu/gdb/gdb-16.2.tar.xz \
            https://sourceware.org/pub/newlib/newlib-4.5.0.20241231.tar.gz
          do
            name=$(basename "$url")
            wget --retry-connrefused --tries=5 --waitretry=10 -c "$url" -O "$name"
            tar -xf "$name" -C .
          done
          ls -d ./*/

      - name: Build the cross toolchain
        if: steps.toolchain.outputs.cache-hit != 'true'
        working-directory: vendor/ndl-src/ndl-sdk/toolchain
        run: ./build_toolchain.sh

      # A cross compiler on its own does not link. The first run proved it: the toolchain built, and
      # then cmake's compiler probe came back broken on three missing archives, because libsyscalls,
      # libndls and nspireio are built from the SDK sources rather than shipped. build-tools pulls
      # thirdparty in behind it, which is where nspireio lives and where luna comes from.
      - name: Build the SDK libraries and tools
        working-directory: vendor/ndl-src/ndl-sdk
        run: |
          export PATH="$PWD/bin:$PWD/toolchain/install/bin:$PATH"
          make build-libndls build-tools -j"$(nproc)"
          ls lib

      - name: Configure
        run: |
          cmake -S nps -B nps/build/device \
            -DCMAKE_TOOLCHAIN_FILE=cmake/toolchains/ndl-arm926ej-s.cmake \
            -DNDL_SDK=${{ github.workspace }}/vendor/ndl-src/ndl-sdk \
            -DGIAC_ROOT=${{ github.workspace }}/vendor/khi-src

      - name: Build the package
        run: cmake --build nps/build/device --target unified --parallel

      # The host suite's package integrity checks verify a built package against its sidecar, so a
      # run that produced one is the only run that can exercise them.
      - uses: actions/upload-artifact@v4
        with:
          name: nspire-package
          path: |
            nps/build/device/*.tns
          if-no-files-found: warn
          retention-days: 7

  # Loading the package into Firebird is the only stage short of the handheld that shows the module
  # actually runs. It needs a TI boot1 and an OS image, which are proprietary and are not in this
  # repository, so this job skips unless they are supplied. Set the NSPIRE_BOOT1_URL and
  # NSPIRE_FLASH_URL repository secrets to somewhere the runner can fetch them from.
  emulator:
    needs: device
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Decide whether the images are available
        id: images
        env:
          BOOT1: ${{ secrets.NSPIRE_BOOT1_URL }}
          FLASH: ${{ secrets.NSPIRE_FLASH_URL }}
        run: |
          if [ -n "$BOOT1" ] && [ -n "$FLASH" ]; then
            echo "have=true" >> "$GITHUB_OUTPUT"
          else
            echo "have=false" >> "$GITHUB_OUTPUT"
            echo "No boot1 or flash image configured, so the emulator stage did not run." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Install prerequisites
        if: steps.images.outputs.have == 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential qtbase5-dev qtdeclarative5-dev qt5-qmake libqt5quick5 xvfb

      - uses: actions/download-artifact@v4
        if: steps.images.outputs.have == 'true'
        with:
          name: nspire-package
          path: package

      - name: Build Firebird
        if: steps.images.outputs.have == 'true'
        working-directory: vendor/firebird-src
        run: |
          qmake firebird-emu.pro
          make -j"$(nproc)"

      # Fetched rather than committed, because these are TI's images and not ours to redistribute.
      - name: Fetch the images
        if: steps.images.outputs.have == 'true'
        env:
          BOOT1: ${{ secrets.NSPIRE_BOOT1_URL }}
          FLASH: ${{ secrets.NSPIRE_FLASH_URL }}
        run: |
          mkdir -p images
          curl -fsSL "$BOOT1" -o images/boot1.img
          curl -fsSL "$FLASH" -o images/flash.img

      - name: Boot the package
        if: steps.images.outputs.have == 'true'
        run: |
          xvfb-run -a vendor/firebird-src/firebird-emu \
            --boot1 images/boot1.img --flash images/flash.img &
          emu=$!
          sleep 90
          kill "$emu" 2>/dev/null || true
          echo "Emulator boot attempted. This stage shows the package loads, not that any UI behaved." >> "$GITHUB_STEP_SUMMARY"
