name: check

# Several agents push to several branches at once, so the two things that decide turnaround are
# canceling superseded runs and giving the fast gate its own job rather than queueing it behind
# the slow one. Both are below.
#
# Everything runs on macos-latest, which is arm64 and the same platform this project is developed
# on. That is the point: the host suite now runs where the code is written. The failure this
# prevents already happened once in the other direction, when eighteen integrity checks staged
# their fixtures under /private/tmp and only fell over on Linux. A runner that matches the
# developer's machine catches the reverse before a push does.
#
# The cost, so nobody rediscovers it: five concurrent macOS jobs per account against twenty on
# Linux, and three cores with 7 GB rather than four with 16. The parallel settings below are sized
# for three cores rather than left at a Linux default.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# One run per ref per event. A second push to the same branch kills the first rather than queueing
# behind it, which is what stops a busy agent from spending every runner on results nobody will read.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

env:
  CCACHE_DIR: ${{ github.workspace }}/.ccache
  CCACHE_MAXSIZE: 900M
  CMAKE_GENERATOR: Ninja
  # brew spends a minute updating itself before every install otherwise, on a job that finishes in
  # three.
  HOMEBREW_NO_AUTO_UPDATE: 1
  HOMEBREW_NO_INSTALL_CLEANUP: 1

jobs:
  fast:
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Verify CI dependency and emulator contracts
        run: ruby .github/scripts/test-ci-scheduling.rb

      - uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Verify event authentication and task routing
        env:
          TEST_WORKSPACE: ${{ runner.temp }}
        run: node --test tools/github-events/bridge.test.mjs tools/github-events/receiver/receiver.test.mjs

      # cmake, ninja, pkgconf, zstd and python3 ship on the image. gmp does not, and the version is
      # not a preference: nps/CMakeLists.txt:345 asks pkg-config for gmp=6.3.0 exactly, so a bump in
      # the formula breaks configure rather than degrading it.
      - name: Install prerequisites
        run: brew install ccache gmp

      - name: Restore compiler cache
        uses: actions/cache@v6
        with:
          path: .ccache
          key: ccache-fast-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            ccache-fast-${{ runner.os }}-

      - name: Configure
        run: |
          export PKG_CONFIG_PATH="$(brew --prefix gmp)/lib/pkgconfig:${PKG_CONFIG_PATH-}"
          cmake -S nps -B nps/build/host \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DNDL_SDK=${{ github.workspace }}/vendor/ndl-src/ndl-sdk \
            -DGIAC_ROOT=${{ github.workspace }}/vendor/khi-src

      - name: Build
        run: cmake --build nps/build/host --parallel

      # A suite that is not registered is silently not run, and -R reports success over whichever
      # ones were. This caught luax_host going missing when the runner had luajit but not its
      # headers. The bridge suite is not here: it needs luajit, and enabling luajit pulls the ARM
      # cross toolchain into configure, which is the opposite of fast. It runs in full instead.
      - name: Check both suites are registered
        run: |
          found=$(ctest --test-dir nps/build/host -N -R '^(unit|ui_smoke_v4)$' | grep -c "Test *#")
          echo "registered: $found"
          test "$found" -eq 2

      - name: Unit and shell suites
        run: ctest --test-dir nps/build/host --output-on-failure -R '^(unit|ui_smoke_v4)$'

      - name: Cache statistics
        if: always()
        run: ccache --show-stats

  # Everything ctest knows about.
  # Gated on the fast suite. If the quick suites are already red, the full run would only report the
  # same failures more slowly, and a runner spent on that is a runner another agent is waiting for.
  # That matters more here than it did on Linux, because five macOS jobs run at once rather than
  # twenty.
  full:
    needs: fast
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      # Not lfs: true. That would pull the 49 MB toolchain on every push and every pull request, and
      # a free account gets 10 GiB of LFS bandwidth a month. The cache below covers the ordinary
      # case, and the pull happens only when it misses.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Install prerequisites
        run: brew install ccache gmp php

      # Same path and same key as the device job, so whichever runs first pays for both.
      - name: Restore the cross toolchain
        id: toolchain
        uses: actions/cache@v6
        with:
          path: vendor/ndl-src/ndl-sdk/toolchain/install
          key: ndl-toolchain-${{ runner.os }}-${{ hashFiles('vendor/ndl-src/ndl-sdk/toolchain/build_toolchain.sh', 'vendor/deps/build-gmp.sh', 'vendor/deps/build-mpfr-mpfi.sh') }}

      # The bridge suite is the one thing the host build cannot reach on its own. Enabling LuaJIT
      # takes configure into nps/CMakeLists.txt:1208, and two lines later it wants the luna binary
      # and a make in the SDK's system directory, both of which need the ARM cross compiler. So a
      # host shared library ends up needing a device toolchain, because what those lines compute is
      # package identity. The committed toolchain is what makes that affordable here.
      - name: Unpack the committed toolchain
        id: unpack
        if: steps.toolchain.outputs.cache-hit != 'true'
        run: |
          stamp=vendor/toolchain/built-from.sha256
          if [ ! -f "$stamp" ]; then
            echo "used=false" >> "$GITHUB_OUTPUT"
            echo "No committed toolchain, so the bridge suite did not run." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          want=$(shasum -a 256 vendor/ndl-src/ndl-sdk/toolchain/build_toolchain.sh \
            vendor/deps/build-gmp.sh vendor/deps/build-mpfr-mpfi.sh | shasum -a 256 | cut -d' ' -f1)
          if [ "$want" != "$(cut -d' ' -f1 < "$stamp")" ]; then
            echo "used=false" >> "$GITHUB_OUTPUT"
            echo "The committed toolchain is stale, so the bridge suite did not run." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git lfs pull --include "vendor/toolchain/*"
          mkdir -p vendor/ndl-src/ndl-sdk/toolchain/install
          zstd -d -c vendor/toolchain/ndl-arm-none-eabi-darwin-arm64.tar.zst \
            | tar -x -C vendor/ndl-src/ndl-sdk/toolchain/install
          echo "used=true" >> "$GITHUB_OUTPUT"

      # Two ways to have a toolchain, and the steps below only care that there is one.
      - name: Note whether a toolchain is present
        id: have
        run: |
          if [ -x vendor/ndl-src/ndl-sdk/toolchain/install/bin/arm-none-eabi-gcc ]; then
            echo "toolchain=true" >> "$GITHUB_OUTPUT"
          else
            echo "toolchain=false" >> "$GITHUB_OUTPUT"
          fi

      # LuaJIT goes on only once the toolchain is here. Installing it without one would take
      # configure down the branch above and fail on the missing nspire-as, which turns a missing
      # suite into a broken job.
      - name: Install the bridge prerequisites
        if: steps.have.outputs.toolchain == 'true'
        run: |
          # boost is for genzehn, which build-tools compiles and which includes
          # boost/program_options.hpp with no include path of its own. The device job needs the same
          # two lines for the same reason.
          brew install luajit boost
          cd vendor/ndl-src/ndl-sdk
          export PATH="$PWD/bin:$PWD/toolchain/install/bin:$PATH"
          export CPATH="$(brew --prefix boost)/include${CPATH:+:$CPATH}"
          export LIBRARY_PATH="$(brew --prefix boost)/lib${LIBRARY_PATH:+:$LIBRARY_PATH}"
          make build-libndls build-tools -j"$(sysctl -n hw.ncpu)"

      - name: Restore compiler cache
        uses: actions/cache@v6
        with:
          path: .ccache
          key: ccache-full-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            ccache-full-${{ runner.os }}-

      - name: Configure
        run: |
          export PKG_CONFIG_PATH="$(brew --prefix gmp)/lib/pkgconfig:${PKG_CONFIG_PATH-}"
          if [ "${{ steps.have.outputs.toolchain }}" = "true" ]; then
            export PKG_CONFIG_PATH="$(brew --prefix luajit)/lib/pkgconfig:$PKG_CONFIG_PATH"
          fi
          cmake -S nps -B nps/build/host \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DNDL_SDK=${{ github.workspace }}/vendor/ndl-src/ndl-sdk \
            -DGIAC_ROOT=${{ github.workspace }}/vendor/khi-src

      - name: Build
        run: cmake --build nps/build/host --parallel

      # Same reason the fast job counts its suites. A suite that failed to register is a suite ctest
      # reports success over, and luax_host is exactly the one that goes missing when a prerequisite
      # is half there.
      - name: Check the bridge suite registered
        if: steps.have.outputs.toolchain == 'true'
        run: |
          ctest --test-dir nps/build/host -N -R '^luax_host$' | grep "Test *#"

      # Not the check target, because that serializes. ctest runs the suites across the runner's
      # cores and reports every failure rather than stopping at the first. Three, because that is
      # what a macos-latest runner has.
      - name: Full suite
        run: ctest --test-dir nps/build/host --output-on-failure --parallel 3

  # CodeQL ran as GitHub's default setup until now, which fires on its own schedule and cannot be
  # told to wait for anything. Here it is a job like the others, so a push whose suites are red
  # spends nothing on scanning code that is about to change. Both suites, not just the gate: full
  # is the one that builds the bridge and the cross package paths.
  #
  # The three languages default setup was scanning. One job each, because only c-cpp needs a build
  # and running the other two behind it would make them wait for it.
  #
  # No ccache here, unlike every other job in this file. CodeQL extracts c-cpp by watching the
  # compiler run, and a ccache hit replays an object without running it, so a warm cache would hand
  # the analysis an empty database and the job would still pass.
  codeql:
    needs: [fast, full, emulator]
    permissions:
      contents: read
      security-events: write
    # The one job in this file not on macOS, and the reason the others are does not reach it: this
    # reads source rather than running it, so a runner matching the developer's machine buys
    # nothing. On macos-latest it could not build at all. Job 103586919848 linked nps_host with
    # /usr/bin/c++ -arch x86_64 against an arm64 libgmp and died on every gmp symbol, because the
    # tracer takes the build x86_64 on an arm64 image. Moving here also stops the three entries
    # eating three of the five macOS slots the account has.
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            build-mode: none
          - language: python
            build-mode: none
          - language: c-cpp
            build-mode: manual
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Install prerequisites
        if: matrix.build-mode == 'manual'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            ninja-build cmake pkg-config libgmp-dev zlib1g-dev python3

      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      # nps_host rather than the full target. CodeQL wants the compiler invocations and nothing
      # more, and the suites this skips were already run by the two jobs above.
      - name: Build under the tracer
        if: matrix.build-mode == 'manual'
        run: |
          cmake -S nps -B nps/build/codeql \
            -DNDL_SDK=${{ github.workspace }}/vendor/ndl-src/ndl-sdk \
            -DGIAC_ROOT=${{ github.workspace }}/vendor/khi-src
          cmake --build nps/build/codeql --target nps_host --parallel

      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}

  emulator:
    needs: fast
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - name: Build and test the headless emulator
        run: make -C vendor/firebird-src/headless -j3 check test-build
      - name: Record emulator coverage
        run: echo "Firebird headless regression tests passed. TI OS boot and StepCAS package loading were not exercised." >> "$GITHUB_STEP_SUMMARY"
