name: check

# Several agents push to several branches at once, so the two things that decide turnaround are
# canceling superseded runs and giving the fast gate its own job rather than queueing it behind
# the slow one. Both are below.
#

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

# One run per ref per event. A second push to the same branch kills the first rather than queueing
# behind it, which is what stops a busy agent from spending every runner on results nobody will read.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

env:
  CCACHE_DIR: ${{ github.workspace }}/.ccache
  CCACHE_MAXSIZE: 900M
  CMAKE_GENERATOR: Ninja

jobs:
  fast:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Verify CI dependency and emulator contracts
        run: ruby .github/scripts/test-ci-scheduling.rb

      - uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Verify event authentication and task routing
        env:
          TEST_WORKSPACE: ${{ runner.temp }}
        run: node --test tools/github-events/bridge.test.mjs tools/github-events/receiver/receiver.test.mjs .github/scripts/test-*.mjs

      - name: Install prerequisites
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config ccache libgmp-dev zlib1g-dev lua5.1 python3
          sudo update-alternatives --set lua-interpreter /usr/bin/lua5.1
          lua -e 'assert(_VERSION == "Lua 5.1")'

      - name: Restore compiler cache
        uses: actions/cache@v6
        with:
          path: .ccache
          key: ccache-fast-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            ccache-fast-${{ runner.os }}-

      - name: Configure
        run: |
          cmake -S nps -B nps/build/host \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DNDL_SDK=${{ github.workspace }}/vendor/ndl-src/ndl-sdk \
            -DGIAC_ROOT=${{ github.workspace }}/vendor/khi-src

      - name: Build
        run: cmake --build nps/build/host --parallel

      # A suite that is not registered is silently not run, and -R reports success over whichever
      # ones were. This caught luax_host going missing when the runner had luajit but not its
      # headers. The bridge suite is not here: it needs luajit, and enabling luajit pulls the ARM
      # cross toolchain into configure, which is the opposite of fast. It runs in full instead.
      - name: Check both suites are registered
        run: |
          found=$(ctest --test-dir nps/build/host -N -R '^(unit|ui_smoke_v4)$' | grep -c "Test *#")
          echo "registered: $found"
          test "$found" -eq 2

      - name: Unit and shell suites
        run: ctest --test-dir nps/build/host --output-on-failure -R '^(unit|ui_smoke_v4)$'

      - name: Cache statistics
        if: always()
        run: ccache --show-stats

  full:
    needs: [fast, review-ready]
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Restore the cross toolchain
        id: toolchain
        uses: actions/cache/restore@v6
        with:
          path: vendor/ndl-src/ndl-sdk/toolchain/install
          key: ndl-toolchain-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.github/scripts/prepare-review.sh', 'vendor/ndl-src/ndl-sdk/toolchain/build_toolchain.sh', 'vendor/deps/build-gmp.sh', 'vendor/deps/build-mpfr-mpfi.sh') }}

      - name: Prepare complete SDK and bridge prerequisites
        run: bash .github/scripts/prepare-review.sh

      - name: Save the complete cross toolchain
        if: steps.toolchain.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: vendor/ndl-src/ndl-sdk/toolchain/install
          key: ${{ steps.toolchain.outputs.cache-primary-key }}

      - name: Restore compiler cache
        uses: actions/cache@v6
        with:
          path: .ccache
          key: ccache-full-${{ runner.os }}-${{ runner.arch }}-${{ github.sha }}
          restore-keys: |
            ccache-full-${{ runner.os }}-${{ runner.arch }}-

      - name: Configure
        run: |
          cmake -S nps -B nps/build/host \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DNDL_SDK=${{ github.workspace }}/vendor/ndl-src/ndl-sdk \
            -DGIAC_ROOT=${{ github.workspace }}/vendor/khi-src

      - name: Build
        run: cmake --build nps/build/host --parallel

      - name: Check the bridge suite registered
        run: ctest --test-dir nps/build/host -N -R '^luax_host$' | grep "Test *#"

      - name: Full suite
        run: ctest --test-dir nps/build/host --output-on-failure --parallel "$(nproc)"

  # CodeQL ran as GitHub's default setup until now, which fires on its own schedule and cannot be
  # told to wait for anything. Here it is a job like the others, so a push whose suites are red
  # spends nothing on scanning code that is about to change. Both suites, not just the gate: full
  # is the one that builds the bridge and the cross package paths.
  #
  # The three languages default setup was scanning. One job each, because only c-cpp needs a build
  # and running the other two behind it would make them wait for it.
  #
  # No ccache here, unlike every other job in this file. CodeQL extracts c-cpp by watching the
  # compiler run, and a ccache hit replays an object without running it, so a warm cache would hand
  # the analysis an empty database and the job would still pass.
  review-ready:
    needs: fast
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 50
    permissions:
      contents: read
      actions: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Wait for the current PR reviewer to approve
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node .github/scripts/wait-for-review.mjs

  codeql:
    needs: [fast, full, emulator, review-ready]
    permissions:
      contents: read
      security-events: write
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            build-mode: none
          - language: python
            build-mode: none
          - language: c-cpp
            build-mode: manual
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Install prerequisites
        if: matrix.build-mode == 'manual'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            ninja-build cmake pkg-config libgmp-dev zlib1g-dev python3

      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      # nps_host rather than the full target. CodeQL wants the compiler invocations and nothing
      # more, and the suites this skips were already run by the two jobs above.
      - name: Build under the tracer
        if: matrix.build-mode == 'manual'
        run: |
          cmake -S nps -B nps/build/codeql \
            -DNDL_SDK=${{ github.workspace }}/vendor/ndl-src/ndl-sdk \
            -DGIAC_ROOT=${{ github.workspace }}/vendor/khi-src
          cmake --build nps/build/codeql --target nps_host --parallel

      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}

  emulator:
    needs: [fast, review-ready]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - name: Install emulator prerequisites
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends build-essential zlib1g-dev
      - name: Build and test the headless emulator
        run: make -C vendor/firebird-src/headless -j3 check test-build
      - name: Record emulator coverage
        run: echo "Firebird headless regression tests passed. TI OS boot and StepCAS package loading were not exercised." >> "$GITHUB_STEP_SUMMARY"
