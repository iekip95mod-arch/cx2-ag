name: agent-review

# The review gate AGENTS.md describes, run by a reviewer that did not write the code.
#
# This also settles the problem that made the gate awkward to record. GitHub refuses an approve on a
# pull request you opened yourself, so an agent working under one account could never do more than
# comment. A review posted from here comes from the workflow's own identity rather than from the
# author's account, so the approve lands and the verdict is machine-readable.

# Not on synchronize. A branch under repair gets several pushes and each one would start a full
# review of a diff that is about to change again, which spends a subscription to read work in
# progress. The review happens when the branch is offered: opened, or taken out of draft, or asked
# for again by putting the claude-review label on it after a fix.
on:
  pull_request:
    types: [opened, ready_for_review, labeled]

# A push that supersedes the branch supersedes the review of it. There is no value in finishing a
# review of a diff that has already been replaced.
concurrency:
  group: agent-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    # A draft is not finished, and reviewing a moving tree is the failure the review lane exists to
    # avoid. A label event fires for every label, so only the one that means this starts a run. The
    # bot test is for the dependabot pull requests: the action refuses a bot author anyway, so
    # without it every action bump starts a job that installs half a toolchain and then declines.
    if: >-
      github.event.pull_request.draft == false &&
      github.event.pull_request.user.type != 'Bot' &&
      (github.event.action != 'labeled' || github.event.label.name == 'claude-review')
    runs-on: macos-latest
    timeout-minutes: 45
    permissions:
      contents: read
      pull-requests: write
      issues: write
      actions: read
      id-token: write
    steps:
      - name: Decide whether a key is configured
        id: key
        env:
          OAUTH: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          API: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -n "$OAUTH" ] || [ -n "$API" ]; then
            echo "have=true" >> "$GITHUB_OUTPUT"
          else
            echo "have=false" >> "$GITHUB_OUTPUT"
            echo "No CLAUDE_CODE_OAUTH_TOKEN or ANTHROPIC_API_KEY is set, so no review was posted." \
              >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/checkout@v7
        if: steps.key.outputs.have == 'true'
        with:
          fetch-depth: 0

      # A reviewer that cannot build is a reviewer that reads, which AGENTS.md says is not a review.
      # Same set the full job installs.
      - name: Install prerequisites
        if: steps.key.outputs.have == 'true'
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
        run: |
          brew install ccache gmp php
          # Published here rather than written into the step below, because the prefix is brew's to
          # report and not ours to spell.
          echo "PKG_CONFIG_PATH=$(brew --prefix gmp)/lib/pkgconfig" >> "$GITHUB_ENV"

      - name: Review the pull request
        if: steps.key.outputs.have == 'true'
        # The reviewer runs a single allowed command per stage, so anything a command needs from the
        # shell has to reach it as an environment variable rather than as an export it cannot
        # perform. PKG_CONFIG_PATH comes from the install step above, because nps/CMakeLists.txt:345
        # asks pkg-config for gmp=6.3.0 exactly and brew keeps that file off the default search path.
        env:
          CCACHE_DIR: ${{ github.workspace }}/.ccache
        # v1 as of this commit. See agent.yml for why these are pinned by digest.
        uses: anthropics/claude-code-action@56cf60fde42f7b19c3abfd5c9c48b69a1288461f
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          track_progress: true
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request. Read the review sections of AGENTS.md first and hold the diff
            to them.

            Your scope is the diff and the issues it claims to close. Nothing else. Judge whether each
            commit fixes what its issue describes, whether the guards hold, and whether the change
            broke something that used to work.

            Two questions are always in scope because both are about the diff by definition.

            Did every piece of new behavior arrive with a test? Do not take the author's word that a
            guard was watched failing. Revert the source change, rebuild, and see which checks go red.
            If reverting the fix leaves the suite green, the guard is decoration and that blocks the
            approval.

            Did this change write something that already existed? Name the thing that should have
            been used and where it lives.

            Anything you find that would still have been true if this branch had never been written
            is pre-existing. File it with gh issue create, name the issue number in your review under
            a heading saying these are separate, and do not hold the branch up over it. Withholding an
            approval over something outside the diff is the same failure as approving a broken change.

            Build and run rather than read. Say in your verdict which stages ran: host build, host
            suite, ARM build, emulator, handheld. A stage nobody reached is a stage the verdict says
            nobody reached.

            These four are what you have, and the spellings are exact. Anything else, including a
            bare nps_host, an export or two commands joined by an ampersand, will be refused, so do
            not spend turns discovering that.

              cmake -S nps -B nps/build/host -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache -DNDL_SDK=$PWD/vendor/ndl-src/ndl-sdk -DGIAC_ROOT=$PWD/vendor/khi-src
              cmake --build nps/build/host --parallel
              ctest --test-dir nps/build/host --output-on-failure
              ctest --test-dir nps/build/host --output-on-failure -R '^unit$'

            ctest is how you read the suite, rather than running the binary, because the fixtures it
            manages are part of what the suite means. Reverting a change to watch its guard fail is
            git apply -R against a patch you made with git diff, and git apply to put it back. The
            ARM cross toolchain is not installed here, so the device stages are not yours to reach
            and the verdict says so.

            Establish the baseline on the base commit before you judge the branch, and hold the
            branch to the number you measured rather than to a number written down here. Do not
            take a count from this prompt. The line that used to sit here named five known
            failures, they were fixed by issue #4, and a reviewer reading it afterwards would have
            been told to accept five failures that no longer exist. Measure, then compare.

            git worktree add is how you get that baseline without disturbing the branch you are
            judging. Check out the base commit into a directory under .Internal/workspaces/, build
            and run there, and keep the branch tree for the branch.

            Finish by posting a review with gh pr review, --approve or --request-changes. A review
            that only lists findings is not an approval, and the merge gate reads the approval rather
            than the prose. If you cannot reach a stage you needed, say which command was refused and
            what it was for, and request changes rather than approving on a reading.
          # Without this the reviewer has only the read-only set in .claude/settings.json, which the
          # action restores from the base branch, and every cmake, ctest and gh call it makes comes
          # back needing an approval nobody on a runner can give. It read the diff and declined to
          # approve, which is the one thing the merge gate cannot accept.
          #
          # Spelled as prefixes rather than as a mode, so the two forms AGENTS.md warns about stay
          # out: cmake -E environment prints every variable in the process, and this job is handed a
          # credential, on a public repository, into a log anybody can read. ctest -S runs a script.
          # Neither matches a prefix below.
          #
          # The read-only gh lines are repeated from .claude/settings.json rather than inherited.
          # Measured on run 34696181673: with this flag set, gh pr view and gh issue list were both
          # refused, so the list here replaces that file rather than adding to it.
          #
          # fetch, worktree, checkout and merge-base are here because a reviewer with none of them
          # cannot reach the base commit, and a baseline is half of what a review is. Run
          # 34702887258 is the evidence: it gave up after six minutes saying checkout and worktree
          # add were refused, tried to rebuild main in place with git apply -R, and posted no
          # verdict at all. None of the four can publish anything, and the checkout above is already
          # fetch-depth 0, so the base commit is present and only the spelling was missing.
          claude_args: |
            --max-turns 80
            --allowedTools "Bash(cmake -S:*),Bash(cmake --build:*),Bash(ctest --test-dir:*),Bash(luajit:*),Bash(git diff:*),Bash(git apply:*),Bash(git log:*),Bash(git show:*),Bash(git status:*),Bash(git rev-parse:*),Bash(git fetch:*),Bash(git worktree:*),Bash(git checkout:*),Bash(git merge-base:*),Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr review:*),Bash(gh pr comment:*),Bash(gh issue view:*),Bash(gh issue list:*),Bash(gh issue create:*),Read,Grep,Glob"
