name: Update issue branches
on:
  push:
    branches: [main]
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]
  workflow_run:
    workflows: [check]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  issues: read

jobs:
  discover:
    if: (github.event_name != 'pull_request_target' || github.event.pull_request.head.repo.full_name == github.repository) && (github.event_name != 'workflow_run' || github.event.workflow_run.pull_requests[0] != null)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.branches.outputs.matrix }}
      count: ${{ steps.branches.outputs.count }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f
        with:
          node-version: "24"
      - id: branches
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.workflow_run.pull_requests[0].number }}
        run: node .github/scripts/update-branches.mjs --discover

  update:
    needs: discover
    if: needs.discover.outputs.count != '0'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.discover.outputs.matrix) }}
    concurrency:
      group: agent-${{ matrix.provider }}-${{ matrix.branch }}
      cancel-in-progress: false
      queue: max
    permissions:
      actions: write
      contents: read
      pull-requests: read
      issues: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f
        with:
          node-version: "24"
      - id: bot
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          app-id: ${{ matrix.app_id }}
          private-key: ${{ matrix.secret_name == 'CX2_AG_CODEX_AMBER_PRIVATE_KEY' && secrets.CX2_AG_CODEX_AMBER_PRIVATE_KEY || matrix.secret_name == 'CX2_AG_CODEX_BIRCH_PRIVATE_KEY' && secrets.CX2_AG_CODEX_BIRCH_PRIVATE_KEY || matrix.secret_name == 'CX2_AG_CODEX_CEDAR_PRIVATE_KEY' && secrets.CX2_AG_CODEX_CEDAR_PRIVATE_KEY || matrix.secret_name == 'CX2_AG_CODEX_FLINT_PRIVATE_KEY' && secrets.CX2_AG_CODEX_FLINT_PRIVATE_KEY || matrix.secret_name == 'CX2_AG_CODEX_MAPLE_PRIVATE_KEY' && secrets.CX2_AG_CODEX_MAPLE_PRIVATE_KEY || matrix.secret_name == 'CX2_AG_CODEX_WILLOW_PRIVATE_KEY' && secrets.CX2_AG_CODEX_WILLOW_PRIVATE_KEY || matrix.secret_name == 'CX2_AG_CLAUDE_ATLAS_PRIVATE_KEY' && secrets.CX2_AG_CLAUDE_ATLAS_PRIVATE_KEY || matrix.secret_name == 'CX2_AG_CLAUDE_COMET_PRIVATE_KEY' && secrets.CX2_AG_CLAUDE_COMET_PRIVATE_KEY || matrix.secret_name == 'CX2_AG_CLAUDE_EMBER_PRIVATE_KEY' && secrets.CX2_AG_CLAUDE_EMBER_PRIVATE_KEY || matrix.secret_name == 'CX2_AG_CLAUDE_NOVA_PRIVATE_KEY' && secrets.CX2_AG_CLAUDE_NOVA_PRIVATE_KEY || matrix.secret_name == 'CX2_AG_CLAUDE_ORION_PRIVATE_KEY' && secrets.CX2_AG_CLAUDE_ORION_PRIVATE_KEY || matrix.secret_name == 'CX2_AG_CLAUDE_VEGA_PRIVATE_KEY' && secrets.CX2_AG_CLAUDE_VEGA_PRIVATE_KEY || matrix.secret_name == 'CX2_AG_CODEX_ASPEN_PRIVATE_KEY' && secrets.CX2_AG_CODEX_ASPEN_PRIVATE_KEY || matrix.secret_name == 'CX2_AG_CODEX_ELM_PRIVATE_KEY' && secrets.CX2_AG_CODEX_ELM_PRIVATE_KEY || matrix.secret_name == 'CX2_AG_CODEX_HAZEL_PRIVATE_KEY' && secrets.CX2_AG_CODEX_HAZEL_PRIVATE_KEY || matrix.secret_name == 'CX2_AG_CODEX_JUNIPER_PRIVATE_KEY' && secrets.CX2_AG_CODEX_JUNIPER_PRIVATE_KEY || matrix.secret_name == 'CX2_AG_CODEX_OAK_PRIVATE_KEY' && secrets.CX2_AG_CODEX_OAK_PRIVATE_KEY || matrix.secret_name == 'CX2_AG_CODEX_PINE_PRIVATE_KEY' && secrets.CX2_AG_CODEX_PINE_PRIVATE_KEY || matrix.secret_name == 'CX2_AG_CLAUDE_AURORA_PRIVATE_KEY' && secrets.CX2_AG_CLAUDE_AURORA_PRIVATE_KEY || matrix.secret_name == 'CX2_AG_CLAUDE_LYRA_PRIVATE_KEY' && secrets.CX2_AG_CLAUDE_LYRA_PRIVATE_KEY || matrix.secret_name == 'CX2_AG_CLAUDE_METEOR_PRIVATE_KEY' && secrets.CX2_AG_CLAUDE_METEOR_PRIVATE_KEY || matrix.secret_name == 'CX2_AG_CLAUDE_NEBULA_PRIVATE_KEY' && secrets.CX2_AG_CLAUDE_NEBULA_PRIVATE_KEY || matrix.secret_name == 'CX2_AG_CLAUDE_PULSAR_PRIVATE_KEY' && secrets.CX2_AG_CLAUDE_PULSAR_PRIVATE_KEY || matrix.secret_name == 'CX2_AG_CLAUDE_SIRIUS_PRIVATE_KEY' && secrets.CX2_AG_CLAUDE_SIRIUS_PRIVATE_KEY || matrix.secret_name == 'CX2_AG_GEMINI_AGATE_PRIVATE_KEY' && secrets.CX2_AG_GEMINI_AGATE_PRIVATE_KEY || matrix.secret_name == 'CX2_AG_GEMINI_BERYL_PRIVATE_KEY' && secrets.CX2_AG_GEMINI_BERYL_PRIVATE_KEY || matrix.secret_name == 'CX2_AG_GEMINI_COBALT_PRIVATE_KEY' && secrets.CX2_AG_GEMINI_COBALT_PRIVATE_KEY || matrix.secret_name == 'CX2_AG_GEMINI_COPPER_PRIVATE_KEY' && secrets.CX2_AG_GEMINI_COPPER_PRIVATE_KEY || matrix.secret_name == 'CX2_AG_GEMINI_CORAL_PRIVATE_KEY' && secrets.CX2_AG_GEMINI_CORAL_PRIVATE_KEY || matrix.secret_name == 'CX2_AG_GEMINI_GARNET_PRIVATE_KEY' && secrets.CX2_AG_GEMINI_GARNET_PRIVATE_KEY || matrix.secret_name == 'CX2_AG_GEMINI_JADE_PRIVATE_KEY' && secrets.CX2_AG_GEMINI_JADE_PRIVATE_KEY || matrix.secret_name == 'CX2_AG_GEMINI_JASPER_PRIVATE_KEY' && secrets.CX2_AG_GEMINI_JASPER_PRIVATE_KEY || matrix.secret_name == 'CX2_AG_GEMINI_ONYX_PRIVATE_KEY' && secrets.CX2_AG_GEMINI_ONYX_PRIVATE_KEY || matrix.secret_name == 'CX2_AG_GEMINI_OPAL_PRIVATE_KEY' && secrets.CX2_AG_GEMINI_OPAL_PRIVATE_KEY || matrix.secret_name == 'CX2_AG_GEMINI_QUARTZ_PRIVATE_KEY' && secrets.CX2_AG_GEMINI_QUARTZ_PRIVATE_KEY || matrix.secret_name == 'CX2_AG_GEMINI_TOPAZ_PRIVATE_KEY' && secrets.CX2_AG_GEMINI_TOPAZ_PRIVATE_KEY || '' }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
      - name: Update the owned branch
        env:
          GH_TOKEN: ${{ steps.bot.outputs.token }}
          ACTIONS_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ matrix.pr }}
          EXECUTOR_LOGIN: ${{ matrix.login }}
        run: node .github/scripts/update-branches.mjs
