name: agent-review-request
run-name: >-
  Assign reviewer for PR #${{ github.event.pull_request.number }} (${{ github.event.action == 'labeled' && !contains(fromJSON('["claude-review", "codex-review", "gemini-review"]'), github.event.label.name) && 'metadata' || 'requested' }})
on:
  pull_request:
    types: [opened, ready_for_review, labeled]

concurrency:
  group: agent-review-${{ github.event.pull_request.number }}-${{ github.event.action == 'labeled' && !contains(fromJSON('["claude-review", "codex-review", "gemini-review"]'), github.event.label.name) && 'assignment-metadata' || 'requested' }}
  cancel-in-progress: false
  queue: max

jobs:
  # full, review-ready and emulator all need fast, so a branch whose fast gate is red cannot merge
  # whatever a reviewer concludes about it. Spending a subscription run to produce a verdict nobody
  # can act on is the waste this stops, and #366 is what it cost: fast failed on every push there
  # while reviewers kept being assigned to it.
  #
  # Only a concluded failure stops the assignment. A fast that is queued or still running is allowed
  # through, because it finishes in about a minute and a review takes far longer than that, so
  # waiting for it would cost more turnaround than it saves.
  fast-gate:
    if: >-
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      (github.event.action != 'labeled' || contains(fromJSON('["claude-review", "codex-review", "gemini-review"]'), github.event.label.name))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      checks: read
    outputs:
      stop: ${{ steps.fast.outputs.stop }}
    steps:
      - name: Read the fast gate on this head
        id: fast
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # The newest completed run wins, because a rerun leaves the earlier attempt in this list.
          conclusion=$(gh api "repos/$GITHUB_REPOSITORY/commits/$HEAD_SHA/check-runs?check_name=fast" \
            --jq '[.check_runs[] | select(.status == "completed")] | sort_by(.completed_at) | last | .conclusion // ""')
          echo "fast on $HEAD_SHA: ${conclusion:-not finished}"
          stop=false
          case "$conclusion" in
            failure|timed_out|cancelled|action_required) stop=true ;;
          esac
          echo "stop=$stop" >> "$GITHUB_OUTPUT"
          if [ "$stop" = true ]; then
            echo "No reviewer was assigned: the fast gate is $conclusion on $HEAD_SHA, so the branch cannot merge on any verdict. Fix fast, then re-add the review label." >> "$GITHUB_STEP_SUMMARY"
          fi

  assign:
    needs: fast-gate
    if: >-
      needs.fast-gate.outputs.stop != 'true' &&
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      (github.event.action != 'labeled' || contains(fromJSON('["claude-review", "codex-review", "gemini-review"]'), github.event.label.name))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ vars.AGENT_CONTROL_SHA || github.event.pull_request.user.type == 'User' && contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.pull_request.author_association) && github.event.pull_request.head.sha || github.event.pull_request.base.sha }}
          persist-credentials: false
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f
        with:
          node-version: "24"
      - name: Require a trusted PR author
        run: node .github/scripts/wait-for-review.mjs --trust-author
      - name: Select the requesting agent's reviewer
        id: reviewer
        shell: bash
        env:
          CODEX_MODEL: ${{ vars.CODEX_MODEL || 'gpt-5.6-sol' }}
          CODEX_EFFORT: ${{ vars.CODEX_EFFORT || 'high' }}
          CLAUDE_MODEL: ${{ vars.CLAUDE_REVIEW_MODEL || vars.CLAUDE_MODEL || 'opus' }}
          CLAUDE_EFFORT: ${{ vars.CLAUDE_REVIEW_EFFORT || vars.CLAUDE_EFFORT || 'high' }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-3.8-flash-high' }}
          GEMINI_EFFORT: ${{ vars.GEMINI_EFFORT || 'high' }}
        run: |
          action=$(jq -r '.action' "$GITHUB_EVENT_PATH")
          requested=true
          label=$(jq -r '.label.name // ""' "$GITHUB_EVENT_PATH")
          if [ "$action" = labeled ] && [ "$label" != claude-review ] && [ "$label" != codex-review ] && [ "$label" != gemini-review ]; then
            requested=false
          fi
          if [ "$action" != labeled ] || [ "$requested" = false ]; then
            labels=$(jq -r '[.pull_request.labels[].name | select(. == "claude-review" or . == "codex-review" or . == "gemini-review")] | unique | .[]' "$GITHUB_EVENT_PATH")
            if [ "$(printf '%s\n' "$labels" | sed '/^$/d' | wc -l | tr -d ' ')" -gt 1 ]; then
              echo "::error::Keep only the requesting agent's review label."
              exit 1
            fi
            label=$labels
          fi
          case "$label" in
            codex-review) reviewer=codex ;;
            claude-review) reviewer=claude ;;
            gemini-review) reviewer=gemini ;;
            '')
              branch=$(jq -r '.pull_request.head.ref' "$GITHUB_EVENT_PATH")
              case "$branch" in
                codex/*) reviewer=codex ;;
                gemini/*) reviewer=gemini ;;
                *) reviewer=claude ;;
              esac
              ;;
            *) exit 1 ;;
          esac
          if [ "$reviewer" = codex ]; then
            model=$CODEX_MODEL
            effort=$CODEX_EFFORT
          elif [ "$reviewer" = gemini ]; then
            model=$GEMINI_MODEL
            effort=$GEMINI_EFFORT
          else
            model=$CLAUDE_MODEL
            effort=$CLAUDE_EFFORT
            selected=$(jq -r '[((.issue.labels // []) + (.pull_request.labels // []))[].name | select(startswith("model:"))] | unique | .[]' "$GITHUB_EVENT_PATH")
            if [ "$(printf '%s\n' "$selected" | sed '/^$/d' | wc -l | tr -d ' ')" -gt 1 ]; then
              echo "::error::Keep only one model label."
              exit 1
            fi
            case "$selected" in
              model:opus|model:sonnet) model=${selected#model:} ;;
              '') ;;
              *) echo "::error::$selected is not a Claude model label."; exit 1 ;;
            esac
          fi
          echo "reviewer=$reviewer" >> "$GITHUB_OUTPUT"
          echo "requested=$requested" >> "$GITHUB_OUTPUT"
          echo "model=$model" >> "$GITHUB_OUTPUT"
          echo "effort=$effort" >> "$GITHUB_OUTPUT"
      - name: Require a trusted review requester
        id: requester
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node .github/scripts/wait-for-review.mjs --trust-requester
      - name: Reserve the reviewer identity
        id: identity
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROVIDER: ${{ steps.reviewer.outputs.reviewer }}
          PR: ${{ github.event.pull_request.number }}
          REVIEW_CAPACITY_WAIT: 'true'
        run: node .github/scripts/bot-identities.mjs allocate --provider "$PROVIDER" --role reviewer --pr "$PR"
      - name: Wait for reviewer capacity
        if: steps.identity.outputs.waiting == 'true'
        run: echo "Waiting for an available reviewer identity. Repository events will retry this assignment when capacity frees." >> "$GITHUB_STEP_SUMMARY"
      - name: Authenticate the assigned reviewer
        if: steps.identity.outputs.waiting != 'true'
        id: bot
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          app-id: ${{ steps.identity.outputs.app_id }}
          private-key: ${{ steps.identity.outputs.secret_name == 'CX2_AG_CODEX_REVIEW_AEGIS_PRIVATE_KEY' && secrets.CX2_AG_CODEX_REVIEW_AEGIS_PRIVATE_KEY || steps.identity.outputs.secret_name == 'CX2_AG_CODEX_REVIEW_BEACON_PRIVATE_KEY' && secrets.CX2_AG_CODEX_REVIEW_BEACON_PRIVATE_KEY || steps.identity.outputs.secret_name == 'CX2_AG_CODEX_REVIEW_COMPASS_PRIVATE_KEY' && secrets.CX2_AG_CODEX_REVIEW_COMPASS_PRIVATE_KEY || steps.identity.outputs.secret_name == 'CX2_AG_CODEX_REVIEW_HARBOR_PRIVATE_KEY' && secrets.CX2_AG_CODEX_REVIEW_HARBOR_PRIVATE_KEY || steps.identity.outputs.secret_name == 'CX2_AG_CODEX_REVIEW_LANTERN_PRIVATE_KEY' && secrets.CX2_AG_CODEX_REVIEW_LANTERN_PRIVATE_KEY || steps.identity.outputs.secret_name == 'CX2_AG_CODEX_REVIEW_PRISM_PRIVATE_KEY' && secrets.CX2_AG_CODEX_REVIEW_PRISM_PRIVATE_KEY || steps.identity.outputs.secret_name == 'CX2_AG_CLAUDE_REVIEW_ANCHOR_PRIVATE_KEY' && secrets.CX2_AG_CLAUDE_REVIEW_ANCHOR_PRIVATE_KEY || steps.identity.outputs.secret_name == 'CX2_AG_CLAUDE_REVIEW_CAIRN_PRIVATE_KEY' && secrets.CX2_AG_CLAUDE_REVIEW_CAIRN_PRIVATE_KEY || steps.identity.outputs.secret_name == 'CX2_AG_CLAUDE_REVIEW_DELTA_PRIVATE_KEY' && secrets.CX2_AG_CLAUDE_REVIEW_DELTA_PRIVATE_KEY || steps.identity.outputs.secret_name == 'CX2_AG_CLAUDE_REVIEW_ECHO_PRIVATE_KEY' && secrets.CX2_AG_CLAUDE_REVIEW_ECHO_PRIVATE_KEY || steps.identity.outputs.secret_name == 'CX2_AG_CLAUDE_REVIEW_GROVE_PRIVATE_KEY' && secrets.CX2_AG_CLAUDE_REVIEW_GROVE_PRIVATE_KEY || steps.identity.outputs.secret_name == 'CX2_AG_CLAUDE_REVIEW_SUMMIT_PRIVATE_KEY' && secrets.CX2_AG_CLAUDE_REVIEW_SUMMIT_PRIVATE_KEY || steps.identity.outputs.secret_name == 'CX2_AG_CODEX_REVIEW_BASTION_PRIVATE_KEY' && secrets.CX2_AG_CODEX_REVIEW_BASTION_PRIVATE_KEY || steps.identity.outputs.secret_name == 'CX2_AG_CODEX_REVIEW_CITADEL_PRIVATE_KEY' && secrets.CX2_AG_CODEX_REVIEW_CITADEL_PRIVATE_KEY || steps.identity.outputs.secret_name == 'CX2_AG_CODEX_REVIEW_LOOKOUT_PRIVATE_KEY' && secrets.CX2_AG_CODEX_REVIEW_LOOKOUT_PRIVATE_KEY || steps.identity.outputs.secret_name == 'CX2_AG_CODEX_REVIEW_SENTINEL_PRIVATE_KEY' && secrets.CX2_AG_CODEX_REVIEW_SENTINEL_PRIVATE_KEY || steps.identity.outputs.secret_name == 'CX2_AG_CODEX_REVIEW_SHIELD_PRIVATE_KEY' && secrets.CX2_AG_CODEX_REVIEW_SHIELD_PRIVATE_KEY || steps.identity.outputs.secret_name == 'CX2_AG_CODEX_REVIEW_WARDEN_PRIVATE_KEY' && secrets.CX2_AG_CODEX_REVIEW_WARDEN_PRIVATE_KEY || steps.identity.outputs.secret_name == 'CX2_AG_CLAUDE_REVIEW_ARCH_PRIVATE_KEY' && secrets.CX2_AG_CLAUDE_REVIEW_ARCH_PRIVATE_KEY || steps.identity.outputs.secret_name == 'CX2_AG_CLAUDE_REVIEW_BROOK_PRIVATE_KEY' && secrets.CX2_AG_CLAUDE_REVIEW_BROOK_PRIVATE_KEY || steps.identity.outputs.secret_name == 'CX2_AG_CLAUDE_REVIEW_CREST_PRIVATE_KEY' && secrets.CX2_AG_CLAUDE_REVIEW_CREST_PRIVATE_KEY || steps.identity.outputs.secret_name == 'CX2_AG_CLAUDE_REVIEW_DUNE_PRIVATE_KEY' && secrets.CX2_AG_CLAUDE_REVIEW_DUNE_PRIVATE_KEY || steps.identity.outputs.secret_name == 'CX2_AG_CLAUDE_REVIEW_RIDGE_PRIVATE_KEY' && secrets.CX2_AG_CLAUDE_REVIEW_RIDGE_PRIVATE_KEY || steps.identity.outputs.secret_name == 'CX2_AG_CLAUDE_REVIEW_VALE_PRIVATE_KEY' && secrets.CX2_AG_CLAUDE_REVIEW_VALE_PRIVATE_KEY || steps.identity.outputs.secret_name == 'CX2_AG_GEMINI_REVIEW_ASTROLABE_PRIVATE_KEY' && secrets.CX2_AG_GEMINI_REVIEW_ASTROLABE_PRIVATE_KEY || steps.identity.outputs.secret_name == 'CX2_AG_GEMINI_REVIEW_CALIPER_PRIVATE_KEY' && secrets.CX2_AG_GEMINI_REVIEW_CALIPER_PRIVATE_KEY || steps.identity.outputs.secret_name == 'CX2_AG_GEMINI_REVIEW_DIAL_PRIVATE_KEY' && secrets.CX2_AG_GEMINI_REVIEW_DIAL_PRIVATE_KEY || steps.identity.outputs.secret_name == 'CX2_AG_GEMINI_REVIEW_FACET_PRIVATE_KEY' && secrets.CX2_AG_GEMINI_REVIEW_FACET_PRIVATE_KEY || steps.identity.outputs.secret_name == 'CX2_AG_GEMINI_REVIEW_GAUGE_PRIVATE_KEY' && secrets.CX2_AG_GEMINI_REVIEW_GAUGE_PRIVATE_KEY || steps.identity.outputs.secret_name == 'CX2_AG_GEMINI_REVIEW_LENS_PRIVATE_KEY' && secrets.CX2_AG_GEMINI_REVIEW_LENS_PRIVATE_KEY || steps.identity.outputs.secret_name == 'CX2_AG_GEMINI_REVIEW_LEVEL_PRIVATE_KEY' && secrets.CX2_AG_GEMINI_REVIEW_LEVEL_PRIVATE_KEY || steps.identity.outputs.secret_name == 'CX2_AG_GEMINI_REVIEW_PLUMB_PRIVATE_KEY' && secrets.CX2_AG_GEMINI_REVIEW_PLUMB_PRIVATE_KEY || steps.identity.outputs.secret_name == 'CX2_AG_GEMINI_REVIEW_RETICLE_PRIVATE_KEY' && secrets.CX2_AG_GEMINI_REVIEW_RETICLE_PRIVATE_KEY || steps.identity.outputs.secret_name == 'CX2_AG_GEMINI_REVIEW_SCALE_PRIVATE_KEY' && secrets.CX2_AG_GEMINI_REVIEW_SCALE_PRIVATE_KEY || steps.identity.outputs.secret_name == 'CX2_AG_GEMINI_REVIEW_SEXTANT_PRIVATE_KEY' && secrets.CX2_AG_GEMINI_REVIEW_SEXTANT_PRIVATE_KEY || steps.identity.outputs.secret_name == 'CX2_AG_GEMINI_REVIEW_TRANSIT_PRIVATE_KEY' && secrets.CX2_AG_GEMINI_REVIEW_TRANSIT_PRIVATE_KEY || '' }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
      - name: Show queued reviewer work
        if: steps.identity.outputs.waiting != 'true'
        env:
          GH_TOKEN: ${{ steps.bot.outputs.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          APP_SLUG: ${{ steps.bot.outputs.app-slug }}
          REVIEW_LOGIN: ${{ steps.identity.outputs.login }}
          REVIEW_USER_ID: ${{ steps.identity.outputs.user_id }}
          REVIEW_MODEL: ${{ steps.reviewer.outputs.model }}
          REVIEW_EFFORT: ${{ steps.reviewer.outputs.effort }}
        run: |
          if grep -Fq -- "--review-queued" .github/scripts/wait-for-review.mjs; then
            node .github/scripts/wait-for-review.mjs --review-queued
          else
            echo "Queued reviewer progress activates after this workflow change reaches the base branch." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Deliver the reviewer assignment
        if: steps.identity.outputs.waiting != 'true'
        env:
          GH_TOKEN: ${{ steps.bot.outputs.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          APP_SLUG: ${{ steps.bot.outputs.app-slug }}
        run: node .github/scripts/wait-for-review.mjs --dispatch-review
      - name: Record successful reviewer handoff
        if: steps.identity.outputs.waiting != 'true'
        env:
          GH_TOKEN: ${{ steps.bot.outputs.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          APP_SLUG: ${{ steps.bot.outputs.app-slug }}
          REVIEW_MODEL: ${{ steps.reviewer.outputs.model }}
          REVIEW_EFFORT: ${{ steps.reviewer.outputs.effort }}
        run: |
          if grep -Fq -- "--review-handoff" .github/scripts/wait-for-review.mjs; then
            node .github/scripts/wait-for-review.mjs --review-handoff
          fi
      - name: Record failed reviewer assignment
        if: always() && steps.bot.outputs.token != '' && job.status != 'success'
        env:
          GH_TOKEN: ${{ steps.bot.outputs.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          APP_SLUG: ${{ steps.bot.outputs.app-slug }}
          REVIEW_MODEL: ${{ steps.reviewer.outputs.model }}
          REVIEW_EFFORT: ${{ steps.reviewer.outputs.effort }}
          PROGRESS_PHASE: ${{ job.status == 'failure' && 'failed' || job.status }}
        run: |
          if grep -Fq -- "--review-final" .github/scripts/wait-for-review.mjs; then
            node .github/scripts/wait-for-review.mjs --review-final
          fi
