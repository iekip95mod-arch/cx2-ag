name: probe-review-count

# Temporary, and deleted in the commit after the one that proves it. The counting pipeline this
# copies lives in agent-review.yml, which cannot demonstrate it on its own branch: the first guard
# there reds out on any branch that edits that file, so every step below it skips. A separate file
# is the only shape that runs, because that guard compares agent-review.yml and nothing else.
#
# Two pull requests rather than one, because a probe that reads an empty list and reports zero looks
# exactly like a probe whose token could not read anything. The one with reviews on it is the
# control that tells those apart.
on: pull_request

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Count the reviews on a pull request that has some and one that has none
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          count() {
            gh api --paginate "repos/$REPO/pulls/$1/reviews" --jq 'length' |
              awk '{total += $1} END {print total + 0}'
          }
          many=$(count 76)
          none=$(count 78)
          echo "76 counted $many, expected 2"
          echo "78 counted $none, expected 0"
          test "$many" -eq 2
          test "$none" -eq 0
